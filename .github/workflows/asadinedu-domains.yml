# Manual: inspect the asadinedu.com zone, or attach a custom domain on asadinedu.com to a Pages project.
# attach: adds the domain to the Pages project and creates the proxied CNAME to <project>.pages.dev when missing.
name: asadinedu.com domains

on:
  workflow_dispatch:
    inputs:
      mode:
        description: inspect; attach a domain to a Pages project; redirects (301 from <project>.pages.dev and www); landing (publish asaddin02/asadinedu to asadinedu.com); kodeloka (build and publish asaddin02/asadin-edu-kodeloka to kodeloka.asadinedu.com)
        type: choice
        options: [inspect, attach, redirects, landing, kodeloka, no-analytics, email]
        default: inspect
      project:
        description: Pages project (attach only), for example mitoloka
        required: false
      hostname:
        description: Full hostname (attach only), for example mitoloka.asadinedu.com
        required: false
      forward_to:
        description: Inbox that receives mail for halo@asadinedu.com (email only)
        required: false
        default: prasada.arif@gmail.com

permissions:
  contents: read

jobs:
  domains:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZONE_NAME: asadinedu.com
      MODE: ${{ inputs.mode }}
      PROJECT: ${{ inputs.project }}
      HOSTNAME_IN: ${{ inputs.hostname }}
      FORWARD_TO: ${{ inputs.forward_to }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect zone, DNS access and Pages domains
        run: |
          api=https://api.cloudflare.com/client/v4
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          zone=$(curl -sS -H "$auth" "$api/zones?name=$ZONE_NAME")
          echo "$zone" | jq '{success, errors, zones: [.result[]? | {name, status, same_account: (.account.id == env.CLOUDFLARE_ACCOUNT_ID)}]}'
          zid=$(echo "$zone" | jq -r '.result[0].id // empty')
          [ -n "$zid" ] || { echo "Zone not visible to the token (needs Zone:Read for $ZONE_NAME)."; exit 1; }
          echo "ZID=$zid" >> "$GITHUB_ENV"
          curl -sS -H "$auth" "$api/zones/$zid/dns_records?per_page=100" | jq '{success, errors, records: [.result[]? | {type, name, content, proxied}]}'
          echo "Bulk Redirect access (lists, rulesets):"
          curl -sS -H "$auth" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/rules/lists" | jq -c '{success, errors: [.errors[]?.message], lists: [.result[]? | .name]}'
          curl -sS -H "$auth" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/rulesets" | jq -c '{success, errors: [.errors[]?.message], rulesets: [.result[]? | {name, phase}]}'
          for p in biotaloka kimialoka fisikaloka mitoloka kodeloka; do
            curl -sS -H "$auth" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$p/domains" | jq -c --arg p "$p" '{project: $p, domains: [.result[]? | {name, status}]}'
          done
      - name: Attach the custom domain
        if: inputs.mode == 'attach'
        run: |
          api=https://api.cloudflare.com/client/v4
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          case "$HOSTNAME_IN" in *."$ZONE_NAME"|"$ZONE_NAME") ;; *) echo "Hostname must be on $ZONE_NAME"; exit 1;; esac
          [ -n "$PROJECT" ] || { echo "project is required"; exit 1; }
          curl -sS -X POST -H "$auth" -H 'Content-Type: application/json' \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains" \
            --data "$(jq -nc --arg n "$HOSTNAME_IN" '{name: $n}')" | jq '{success, errors, result: .result | {name, status}}'
          existing=$(curl -sS -H "$auth" "$api/zones/$ZID/dns_records?name=$HOSTNAME_IN" | jq -r '[.result[] | select(.type == "CNAME" or .type == "A" or .type == "AAAA")] | length')
          if [ "$existing" = 0 ]; then
            curl -sS -X POST -H "$auth" -H 'Content-Type: application/json' "$api/zones/$ZID/dns_records" \
              --data "$(jq -nc --arg n "$HOSTNAME_IN" --arg c "$PROJECT.pages.dev" '{type: "CNAME", name: $n, content: $c, proxied: true, ttl: 1}')" \
              | tee /dev/stderr | jq -e '.success' > /dev/null
          else
            echo "A DNS record for $HOSTNAME_IN already exists; left unchanged."
          fi
      - name: Redirect the pages.dev addresses to asadinedu.com
        if: inputs.mode == 'redirects'
        run: |
          api=https://api.cloudflare.com/client/v4
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          acct="$api/accounts/$CLOUDFLARE_ACCOUNT_ID"
          name=pages_dev_to_asadinedu
          lid=$(curl -sS -H "$auth" "$acct/rules/lists" | jq -r --arg n "$name" '.result[]? | select(.name == $n) | .id')
          if [ -z "$lid" ]; then
            lid=$(curl -sS -X POST -H "$auth" -H 'Content-Type: application/json' "$acct/rules/lists" \
              --data "$(jq -nc --arg n "$name" '{name: $n, kind: "redirect", description: "Pages projects moved to asadinedu.com subdomains"}')" \
              | tee /dev/stderr | jq -r '.result.id')
          fi
          [ -n "$lid" ] && [ "$lid" != null ] || exit 1
          # Each project's own pages.dev host (kodeloka's is suffixed because the plain name was taken).
          hosts=$(for p in biotaloka kimialoka fisikaloka mitoloka kodeloka; do
            curl -sS -H "$auth" "$acct/pages/projects/$p" | jq -c --arg p "$p" '{project: $p, host: .result.subdomain}'; done | jq -sc '.')
          echo "$hosts"
          [ "$(echo "$hosts" | jq 'map(select(.host == null)) | length')" = 0 ] || { echo "A Pages project could not be read"; exit 1; }
          items=$(jq -nc --argjson hosts "$hosts" '($hosts | map({redirect: {
            source_url: "\(.host)/", target_url: "https://\(.project).asadinedu.com/", status_code: 301,
            include_subdomains: false, subpath_matching: true, preserve_query_string: true, preserve_path_suffix: true }}))
            + [{redirect: { source_url: "www.asadinedu.com/", target_url: "https://asadinedu.com/", status_code: 301,
            include_subdomains: false, subpath_matching: true, preserve_query_string: true, preserve_path_suffix: true }},
               {redirect: { source_url: "asadinedu.pages.dev/", target_url: "https://asadinedu.com/", status_code: 301,
            include_subdomains: false, subpath_matching: true, preserve_query_string: true, preserve_path_suffix: true }}]')
          curl -sS -X PUT -H "$auth" -H 'Content-Type: application/json' "$acct/rules/lists/$lid/items" --data "$items" \
            | tee /dev/stderr | jq -e '.success' > /dev/null
          rules=$(jq -nc --arg n "$name" '{rules: [{ description: "pages.dev to asadinedu.com", enabled: true,
            expression: "http.request.full_uri in $\($n)", action: "redirect",
            action_parameters: { from_list: { name: $n, key: "http.request.full_uri" } } }]}')
          curl -sS -X PUT -H "$auth" -H 'Content-Type: application/json' "$acct/rulesets/phases/http_request_redirect/entrypoint" \
            --data "$rules" | tee /dev/stderr | jq -e '.success' > /dev/null
      - name: Publish the Asadin Edu landing to asadinedu.com
        if: inputs.mode == 'landing'
        run: |
          git clone --depth 1 https://github.com/asaddin02/asadinedu.git landing
          mkdir site && (cd landing && cp -r index.html 404.html styles.css app.js robots.txt sitemap.xml _headers assets ../site/)
          npx --yes wrangler@4 pages project create asadinedu --production-branch=main || echo "Project already exists."
          npx --yes wrangler@4 pages deploy site --project-name=asadinedu --branch=main --commit-hash="$(git -C landing rev-parse HEAD)" --commit-dirty=true
          api=https://api.cloudflare.com/client/v4
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          for host in asadinedu.com www.asadinedu.com; do
            curl -sS -X POST -H "$auth" -H 'Content-Type: application/json' \
              "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/asadinedu/domains" \
              --data "$(jq -nc --arg n "$host" '{name: $n}')" | jq -c '{host: "'"$host"'", success, errors: [.errors[]?.message]}'
            n=$(curl -sS -H "$auth" "$api/zones/$ZID/dns_records?name=$host" | jq -r '[.result[] | select(.type == "CNAME" or .type == "A" or .type == "AAAA")] | length')
            if [ "$n" = 0 ]; then
              curl -sS -X POST -H "$auth" -H 'Content-Type: application/json' "$api/zones/$ZID/dns_records" \
                --data "$(jq -nc --arg n "$host" '{type: "CNAME", name: $n, content: "asadinedu.pages.dev", proxied: true, ttl: 1}')" \
                | jq -c '{dns: "'"$host"'", success, errors: [.errors[]?.message]}'
            fi
          done
      - name: Build and publish Kodeloka to kodeloka.asadinedu.com
        if: inputs.mode == 'kodeloka'
        env:
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: |
          git clone --depth 1 https://github.com/asaddin02/asadin-edu-kodeloka.git kodeloka
          (cd kodeloka && SITE_URL=https://kodeloka.asadinedu.com node scripts/build.mjs)
          npx --yes wrangler@4 pages project create kodeloka --production-branch=main || echo "Project already exists."
          npx --yes wrangler@4 pages deploy kodeloka/dist --project-name=kodeloka --branch=main --commit-hash="$(git -C kodeloka rev-parse HEAD)" --commit-dirty=true
          api=https://api.cloudflare.com/client/v4
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          host=kodeloka.asadinedu.com
          curl -sS -X POST -H "$auth" -H 'Content-Type: application/json' \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/kodeloka/domains" \
            --data "$(jq -nc --arg n "$host" '{name: $n}')" | jq -c '{host: "'"$host"'", success, errors: [.errors[]?.message]}'
          # kodeloka.pages.dev belongs to another account, so the project got a suffixed subdomain; point the
          # CNAME at whatever Cloudflare assigned, and correct an existing record that points elsewhere.
          target=$(curl -sS -H "$auth" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/kodeloka" | jq -r '.result.subdomain')
          [ -n "$target" ] && [ "$target" != null ] || { echo "Could not read the project's pages.dev subdomain"; exit 1; }
          record=$(curl -sS -H "$auth" "$api/zones/$ZID/dns_records?name=$host" | jq -c '[.result[] | select(.type == "CNAME" or .type == "A" or .type == "AAAA")][0] // empty')
          body=$(jq -nc --arg n "$host" --arg c "$target" '{type: "CNAME", name: $n, content: $c, proxied: true, ttl: 1}')
          if [ -z "$record" ]; then
            curl -sS -X POST -H "$auth" -H 'Content-Type: application/json' "$api/zones/$ZID/dns_records" --data "$body" \
              | jq -c '{dns: "'"$host"'", target: "'"$target"'", success, errors: [.errors[]?.message]}'
          elif [ "$(echo "$record" | jq -r .content)" != "$target" ]; then
            curl -sS -X PUT -H "$auth" -H 'Content-Type: application/json' "$api/zones/$ZID/dns_records/$(echo "$record" | jq -r .id)" --data "$body" \
              | jq -c '{dns: "'"$host"'", updated_to: "'"$target"'", success, errors: [.errors[]?.message]}'
          else
            echo "DNS for $host already points at $target."
          fi
          curl -sS -H "$auth" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/kodeloka/domains" | jq -c '[.result[]? | {name, status}]'
      - name: Turn off Cloudflare Web Analytics injection (the sites promise no analytics)
        if: inputs.mode == 'no-analytics'
        run: |
          api=https://api.cloudflare.com/client/v4
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          list=$(curl -sS -H "$auth" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/rum/site_info/list?per_page=50")
          echo "$list" | jq -c '{success, errors: [.errors[]?.message], sites: [.result[]? | {site_tag, host: .ruleset.zone_name, auto_install}]}'
          for tag in $(echo "$list" | jq -r '.result[]? | select(.ruleset.zone_name == env.ZONE_NAME) | .site_tag'); do
            curl -sS -X DELETE -H "$auth" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/rum/site_info/$tag" | jq -c '{deleted: "'"$tag"'", success, errors: [.errors[]?.message]}'
          done
      - name: Email Routing for halo@asadinedu.com
        if: inputs.mode == 'email'
        run: |
          api=https://api.cloudflare.com/client/v4
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          show() { jq -c '{success, errors: [.errors[]?.message], result: (.result | if type == "array" then map({id, email, verified, name, enabled, type, content}) else . end)}'; }
          echo "Routing settings:"; curl -sS -H "$auth" "$api/zones/$ZID/email/routing" | show
          echo "Destination addresses:"; curl -sS -H "$auth" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/email/routing/addresses" | show
          echo "Add destination (Cloudflare mails a verification link):"
          curl -sS -X POST -H "$auth" -H 'Content-Type: application/json' "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/email/routing/addresses" \
            --data "$(jq -nc --arg e "$FORWARD_TO" '{email: $e}')" | show
          echo "Remove the old Namecheap forwarding records:"
          for id in $(curl -sS -H "$auth" "$api/zones/$ZID/dns_records?per_page=100" | jq -r '.result[] | select((.type == "MX" and (.content | test("registrar-servers"))) or (.type == "TXT" and (.content | test("efwd.registrar-servers")))) | .id'); do
            curl -sS -X DELETE -H "$auth" "$api/zones/$ZID/dns_records/$id" | jq -c '{deleted: "'"$id"'", success}'
          done
          echo "Enable routing (adds Cloudflare MX and SPF):"; curl -sS -X POST -H "$auth" "$api/zones/$ZID/email/routing/enable" | show
          echo "Rule halo@ -> $FORWARD_TO:"
          curl -sS -X POST -H "$auth" -H 'Content-Type: application/json' "$api/zones/$ZID/email/routing/rules" \
            --data "$(jq -nc --arg to "$FORWARD_TO" '{name: "halo@asadinedu.com", enabled: true,
              matchers: [{type: "literal", field: "to", value: "halo@asadinedu.com"}],
              actions: [{type: "forward", value: [$to]}]}')" | show
