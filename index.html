<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#160f09">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mitoloka — Ensiklopedia Makhluk Mitologi & Folklor Dunia</title>
  <meta name="description" content="Mitoloka adalah ensiklopedia digital dwibahasa untuk mengeksplorasi makhluk mitologi, arwah legenda, naga purba, dan entitas supernatural dari seluruh peradaban dunia dengan rujukan sumber dan konteks budaya.">
  <meta name="keywords" content="mitologi, folklor, makluk mitologi, bestiary, pocong, kuntilanak, garuda, kitsune, jormungandr, quetzalcoatl, ensiklopedia">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mitoloka.org/">
  <meta property="og:title" content="Mitoloka — Ensiklopedia Makhluk Mitologi Dunia">
  <meta property="og:description" content="Temukan rahasia makhluk mitologi, arwah folklor, dan legenda kuno dari berbagai peradaban dunia.">
  <meta property="og:image" content="/assets/logo.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Mitoloka — Ensiklopedia Makhluk Mitologi Dunia">
  <meta name="twitter:description" content="Temukan rahasia makhluk mitologi, arwah folklor, dan legenda kuno dari berbagai peradaban dunia.">
  <meta name="twitter:image" content="/assets/logo.png">

  <!-- Manifest -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/brand-mark.svg">

  <!-- Local typefaces: no external font request. -->
  <link rel="preload" href="/assets/fonts/cinzel-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/cormorant-garamond-roman-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/creature-detail.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/editorial.css">
  <link rel="stylesheet" href="/css/bestiary.css">
  <link rel="stylesheet" href="/css/tier-frames.css">
  <link rel="stylesheet" href="/css/gallery.css">
  <link rel="stylesheet" href="/css/detail-editorial.css">
  <link rel="stylesheet" href="/css/archive.css">
  <link rel="stylesheet" href="/css/support.css">
</head>
<body>
  <a class="skip-link" href="#app">Langsung ke konten / Skip to content</a>
  <!-- Header / Navigation Root -->
  <div id="header-root"></div>

  <!-- Dynamic Application Main Container. The static build pre-fills it with the page's content. -->
  <main id="app" role="main" tabindex="-1">
    <div id="app-boot-loading" class="container" style="padding: 6rem 1.5rem; text-align: center; font-family: 'Cinzel', serif; font-size: 1.5rem; color: #c6aa76; letter-spacing: 0.15em;">
      ✦ MEMBUKA GERBANG ARSIP KOSMIS... ✦
      <noscript><p style="font-size: 1rem; letter-spacing: 0; font-family: inherit;">Aktifkan JavaScript untuk menjelajahi Mitoloka. / Enable JavaScript to explore Mitoloka.</p></noscript>
    </div>
  </main>
  <!-- Shown only when the application script fails to load (see the script's onerror below). -->
  <template id="app-boot-fallback">
    <div id="app-boot-error" role="alert" class="container" style="padding: 6rem 1.5rem; text-align: center;">
      <h1>Arsip belum dapat dibuka.</h1>
      <p>Periksa koneksi lalu coba lagi. / Check your connection and try again.</p>
      <button type="button" class="btn btn-primary" onclick="location.reload()">Coba lagi / Try again</button>
    </div>
  </template>

  <!-- Footer Root -->
  <div id="footer-root"></div>

  <!-- Application Script -->
  <script type="module" src="/js/app.js" onerror="document.getElementById('app-boot-loading')?.remove();document.getElementById('app').prepend(document.getElementById('app-boot-fallback').content.cloneNode(true));"></script>
</body>
</html>
